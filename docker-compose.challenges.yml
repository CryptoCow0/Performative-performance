services:  
  # === Challenge 01: Missing Index ===
  challenge-01-missing-index:
    build: ./challenges/01-missing-index
   
    depends_on:
      - challenge-01-db
  challenge-01-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=challenge
      - POSTGRES_PASSWORD=challenge
      - POSTGRES_DB=orders
    volumes:
      - ./challenges/01-missing-index/seed.sql:/docker-entrypoint-initdb.d/seed.sql
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # === Challenge 02: Transaction Batching ===
  challenge-02-transaction-batching:
    build: ./challenges/02-transaction-batching
    
    depends_on:
      - challenge-02-db

  challenge-02-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=challenge
      - POSTGRES_PASSWORD=challenge
      - POSTGRES_DB=events
    volumes:
      - ./challenges/02-transaction-batching/seed.sql:/docker-entrypoint-initdb.d/seed.sql

  # === Challenge 03: Chatty API ===
  challenge-03-chatty-api:
    build: ./challenges/03-chatty-api
    
    depends_on:
      - challenge-03-backend

  challenge-03-backend:
    build: ./challenges/03-chatty-api/backend
    environment:
      - SIMULATED_LATENCY_MS=50

  # === Challenge 04: Bounded Concurrency ===
  challenge-04-bounded-concurrency:
    build: ./challenges/04-bounded-concurrency
   
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # === Challenge 05: List to Set ===
  challenge-05-list-to-set:
    build: ./challenges/05-list-to-set
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # === Challenge 06: N² Deduplication ===
  challenge-06-n-squared-dedup:
    build: ./challenges/06-n-squared-dedup
    
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # === 07: MyGov Database Profiler ===
  challenge-07-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=mygov
      - POSTGRES_PASSWORD=mygov
      - POSTGRES_DB=mygov
    volumes:
      - ./challenges/07-mygovdatabase-profiler/seed.sql:/docker-entrypoint-initdb.d/seed.sql
