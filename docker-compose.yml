services:
  # === CTFd Platform ===
  ctfd:
    image: ctfd/ctfd:latest
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://ctfd:ctfd@ctfd-db/ctfd
      - REDIS_URL=redis://ctfd-redis:6379
      - SECRET_KEY=change-me-in-production
    depends_on:
      ctfd-db:
        condition: service_healthy
      ctfd-redis:
        condition: service_started
    networks:
      - ctf-edge
      - default
    volumes:
      - ctfd-uploads:/var/uploads
      - ctfd-logs:/var/log/CTFd

  ctfd-db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=ctfd
      - MYSQL_USER=ctfd
      - MYSQL_PASSWORD=ctfd
      - MYSQL_DATABASE=ctfd
    volumes:
      - ctfd-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
  
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - ctf-edge
      - default

  ctfd-redis:
    image: redis:7-alpine

networks:
  ctf-edge:
    external: true
  default: {}


volumes:
  ctfd-uploads:
  ctfd-logs:
  ctfd-mysql: 
  caddy-data:
  caddy-config: